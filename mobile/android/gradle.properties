# Low-memory development profile (tested on a 4 GB Windows laptop).
# This limits Gradle concurrency; no Android runtime behavior changes.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.builtInKotlin=false
android.newDsl=false
